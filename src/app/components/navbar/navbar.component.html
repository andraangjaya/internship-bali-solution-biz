@if (mobileMenuOpen) {
  <div
    class="fixed inset-0 z-40 backdrop-blur-2xl bg-black border border-line-default flex flex-col items-center justify-center gap-10 sm:hidden">
    <button
      type="button"
      (click)="navigateToSection('company')"
      class="text-3xl font-semibold text-white font-figtree hover:text-gray-300 transition-colors"
    >Company
    </button>
    <button
      type="button"
      (click)="navigateToSection('journey')"
      class="text-3xl font-semibold text-white font-figtree hover:text-gray-300 transition-colors"
    >Journey
    </button>
    <button
      type="button"
      (click)="navigateToSection('skills')"
      class="text-3xl font-semibold text-white font-figtree hover:text-gray-300 transition-colors"
    >Skills
    </button>
    <button
      type="button"
      (click)="navigateToSection('projects')"
      class="text-3xl font-semibold text-white font-figtree hover:text-gray-300 transition-colors"
    >Projects
    </button>
    <div class="w-16 h-px bg-white/20"></div>
    <a href="https://github.com/andraangjaya" target="_blank" rel="noopener noreferrer"
       class="flex items-center gap-3 text-white hover:text-gray-300 transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6">
        <path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.44 9.8 8.2 11.38.6.1.82-.26.82-.58
          0-.28-.01-1.04-.02-2.04-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76
          -1.09-.75.08-.74.08-.74 1.2.09 1.84 1.24 1.84 1.24 1.07 1.84 2.81 1.31 3.49 1
          .11-.78.42-1.31.76-1.61-2.67-.31-5.47-1.34-5.47-5.93
          0-1.31.47-2.38 1.24-3.22-.12-.31-.54-1.56.12-3.25
          0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.29-1.55 3.3-1.23 3.3-1.23
          .66 1.69.24 2.94.12 3.25.77.84 1.24 1.91 1.24 3.22
          0 4.61-2.8 5.62-5.48 5.92.43.37.82 1.1.82 2.22
          0 1.61-.01 2.91-.01 3.31 0 .32.22.69.83.57A12.01 12.01 0 0 0 24 12

      </svg>
      <span class="text-xl font-semibold font-figtree">GitHub</span>
    </a>
  </div>
}

<nav
  class="flex flex-row justify-between fixed bottom-8 left-1/2 -translate-x-1/2 w-[min(92vw,1000px)] px-5 sm:px-8 lg:px-10 py-3 sm:py-4 rounded-full border border-line-default shadow-[0_20px_50px_rgba(0,0,0,0.5)] ring-1 ring-white/10 hover:shadow-blue-500/10 hover:border-white/30 hover:-translate-y-1 items-center backdrop-blur-2xl bg-primary/70 z-50 transition-all duration-300">
  <div class="flex flex-row items-center gap-3 sm:gap-6 mx-3 sm:mx-0">
    <button type="button" routerLink="home">
      <span
        class="text-xl sm:text-2xl lg:text-3xl text-center font-semibold text-white font-figtree transition-colors hover:text-gray-300">Andra</span>
    </button>
  </div>

  <div
    class="flex flex-row items-center gap-3 sm:gap-5 lg:gap-6 text-sm sm:text-base lg:text-lg text-center font-semibold text-white font-figtree">
    <button type="button" (click)="navigateToSection('company')"
            class="hidden sm:block transition-colors hover:text-gray-300">
      Company
    </button>
    <button type="button" (click)="navigateToSection('journey')"
            class="hidden sm:block transition-colors hover:text-gray-300">
      Journey
    </button>
    <button type="button" (click)="navigateToSection('skills')"
            class="hidden sm:block transition-colors hover:text-gray-300">
      Skills
    </button>
    <button type="button" (click)="navigateToSection('projects')"
            class="hidden sm:block transition-colors hover:text-gray-300">
      Projects
    </button>
    <div class="hidden sm:block">|</div>
    <a href="https://github.com/andraangjaya" target="_blank" rel="noopener noreferrer" class="hidden sm:block">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"
           class="w-5 h-5 sm:w-6 sm:h-6 text-white hover:text-gray-300 transition-colors">
        <path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.44 9.8 8.2 11.38.6.1.82-.26.82-.58
          0-.28-.01-1.04-.02-2.04-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76
          -1.09-.75.08-.74.08-.74 1.2.09 1.84 1.24 1.84 1.24 1.07 1.84 2.81 1.31 3.49 1
          .11-.78.42-1.31.76-1.61-2.67-.31-5.47-1.34-5.47-5.93
          0-1.31.47-2.38 1.24-3.22-.12-.31-.54-1.56.12-3.25
          0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.29-1.55 3.3-1.23 3.3-1.23
          .66 1.69.24 2.94.12 3.25.77.84 1.24 1.91 1.24 3.22
          0 4.61-2.8 5.62-5.48 5.92.43.37.82 1.1.82 2.22
          0 1.61-.01 2.91-.01 3.31 0 .32.22.69.83.57A12.01 12.01 0 0 0 24 12
          c0-6.63-5.37-12-12-12Z"/>
      </svg>
    </a>

    <button
      type="button"
      (click)="mobileMenuOpen = !mobileMenuOpen"
      class="sm:hidden flex flex-col justify-center items-center gap-1.5 w-8 h-8"
    >
      <span class="block w-6 h-0.5 bg-white rounded transition-all duration-300"
            [class.rotate-45]="mobileMenuOpen"
            [class.translate-y-2]="mobileMenuOpen">
      </span>
      <span class="block w-6 h-0.5 bg-white rounded transition-all duration-300"
            [class.opacity-0]="mobileMenuOpen">
      </span>
      <span class="block w-6 h-0.5 bg-white rounded transition-all duration-300"
            [class.-rotate-45]="mobileMenuOpen"
            [class.-translate-y-2]="mobileMenuOpen">
      </span>
    </button>
  </div>
</nav>
